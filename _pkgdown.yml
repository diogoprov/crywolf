url: https://provetelab.org/crywolf/

template:
  bootstrap: 5
  math-rendering: katex
  bslib:
    primary: "#241042"

navbar:
  structure:
    left:  [intro, reference, articles, cheatsheet, news]
    right: [search, github]
  components:
    cheatsheet:
      text: Cheat sheet
      href: cheatsheet/crywolf-cheatsheet.pdf

home:
  sidebar:
    structure: [links, license, citation, authors, dev]

reference:
  - title: Data
    desc: Assemble automated and verified detections and site covariates.
    contents:
      - fp_data
      - fp_data_wide
      - fp_to_unmarked
  - title: Reading classifier output
    desc: Read BirdNET selection tables and reviewed clips, and build occasions.
    contents:
      - fp_read_birdnet
      - fp_read_validation
      - fp_read_sheepdog
      - fp_aggregate
      - fp_threshold_sweep
  - title: Fitting
    desc: Fit the model and inspect, summarize, predict, and compare fits.
    contents:
      - fp_occu
      - fp_occu_dyn
      - fp_occu_ms
      - fp_richness
      - predict.fp_occu_ms
      - simulate_fp_ms
      - fp_occu_mc
      - fp_draws_data
      - fp_priors
      - fp_occu-methods
      - crywolf-output
      - crywolf-api
      - fp_loo_weights
      - fp_gap_prior
      - fp_prior_predictive
      - fp_ppc
      - fp_compile
      - fp_stan_file
  - title: Plots and site-level estimates
    desc: Coefficients, diagnostics, marginal effects, and occupancy of each site.
    contents:
      - plot.fp_occu
      - fp_effects
      - fp_sites
      - plot.fp_ppc
  - title: Simulation and calibration
    desc: Simulate false-positive regimes and check interval calibration for a design.
    contents:
      - simulate_fp
      - simulate_fp_dyn
      - fp_calibrate
      - fp_verification_curve
      - fp_calibrate_fit
      - fp_sbc
      - simulate.fp_occu
      - simulate.fp_occu_dyn
      - simulate.fp_occu_ms
      - plot.fp_calibration
  - title: Example data
    desc: >
      Passive acoustic monitoring of the Common Pauraque in the Pantanal, and
      surveys of the American pika.
    contents:
      - curiango
      - pika
  - title: Package
    contents:
      - crywolf-package
      - reexports

articles:
  - title: Get started
    navbar: ~
    contents:
      - crywolf
