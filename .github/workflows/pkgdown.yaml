on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          # sheepdog (Suggests) is published there, not on CRAN
          extra-repositories: https://diogoprov.r-universe.dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
      - name: Month, for the CmdStan cache key
        id: month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Cache CmdStan
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}-${{ runner.arch }}-${{ steps.month.outputs.month }}
      - name: Install CmdStan
        run: |
          # a cache restored from an interrupted build has no stanc: reinstall
          v <- cmdstanr::cmdstan_version(error_on_NA = FALSE)
          if (is.null(v) || !file.exists(file.path(cmdstanr::cmdstan_path(), "bin", "stanc"))) {
            cmdstanr::install_cmdstan(cores = 2, overwrite = TRUE)
          }
        shell: Rscript {0}
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
