    desc: Fit the model and inspect, summarize, predict, and compare fits.
    contents:
      - fp_occu
      - fp_priors
      - fp_occu-methods
      - fp_ppc
      - fp_compile
      - fp_stan_file
  - title: Simulation and calibration
    desc: Simulate false-positive regimes and check interval calibration for a design.
    contents:
      - simulate_fp
      - fp_calibrate
      - fp_verification_curve
      - plot.fp_calibration
  - title: Example data
    desc: Passive acoustic monitoring of the Common Pauraque in the Pantanal.
    contents:
      - curiango
  - title: Package
    contents:
      - crywolf-package
      - reexports

articles:
  - title: Get started
    navbar: ~
    contents:
      - crywolf
  - title: Guides
