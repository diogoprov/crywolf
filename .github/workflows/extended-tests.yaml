# The long statistical tests (CRYWOLF_EXTENDED_TESTS=true; see
# tests/README.md): parameter recovery over several datasets, stability to
# noise and to the seed, agreement with unmarked::occuFP(), precision and
# run time against the number of sites. Weekly and on demand.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

name: extended-tests

permissions: read-all

jobs:
  extended-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      CRYWOLF_EXTENDED_TESTS: true
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: https://diogoprov.r-universe.dev https://stan-dev.r-universe.dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 25
        with:
          extra-packages: any::devtools, any::unmarked
      - name: Month and runner image, for the CmdStan cache key
        id: month
        run: |
          echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageVersion:-none}" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Cache CmdStan
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          # same key as in R-CMD-check.yaml, so the workflows share it
          key: cmdstan-${{ runner.os }}-${{ runner.arch }}-${{ steps.month.outputs.image }}-${{ steps.month.outputs.month }}
      - name: Install CmdStan
        run: |
          v <- cmdstanr::cmdstan_version(error_on_NA = FALSE)
          if (is.null(v) || utils::compareVersion(v, "2.40.0") < 0 ||
              !file.exists(file.path(cmdstanr::cmdstan_path(), "bin", "stanc"))) {
            cmdstanr::install_cmdstan(cores = 2, overwrite = TRUE)
          }
          cat("CmdStan", cmdstanr::cmdstan_version(), "\n")
        shell: Rscript {0}
      - name: Extended tests
        run: |
          res <- devtools::test(reporter = "summary", stop_on_failure = TRUE)
        shell: Rscript {0}
