url: https://provetelab.org/crywolf/

template:
  bootstrap: 5
  math-rendering: mathjax
  bslib:
    primary: "#241042"

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]

home:
  sidebar:
    structure: [links, license, citation, authors, dev]

reference:
  - title: Data
    desc: Assemble automated and verified detections and site covariates.
    contents:
      - fp_data
      - fp_data_wide
